# Server Port: Read cloud-assigned PORT or default to 8080 locally
server.port=${PORT:8080}

# Database Configuration using Environment Variables with Localhost Defaults
# Locally: connects to localhost:3306/employee_db with user 'root' and empty password
# Production: set DB_URL, DB_USERNAME, and DB_PASSWORD environment variables in your cloud hosting provider
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/employee_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:emp_user}
spring.datasource.password=${DB_PASSWORD:Hello1234}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
# 'update': Automatically updates the schema structure without deleting existing production data.
# It is safe for continuous deployment on free cloud tiers.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Open-in-view setting
spring.jpa.open-in-view=false
